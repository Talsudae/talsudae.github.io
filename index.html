<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>טל סודאי · האלבום הבא</title>
<meta name="theme-color" content="#f6f0e4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Rubik:wght@500;800&display=swap" rel="stylesheet">

<script>
/* =========================================================
   ✏️  כאן עורכים הכל. רק בין המירכאות "..." ובמספרים.
   תמונות: מחליפים את הקבצים photo-30.jpg / photo-70.jpg / photo-150.jpg
   באותו שם בדיוק, בתוך התיקייה.
   עריכה: ב-GitHub פותחים את index.html, לוחצים על העיפרון, משנים, ולוחצים Commit changes.
   הכתובת talsudae.github.io לא משתנה לעולם.
   ========================================================= */
const SETTINGS = {
  title:    "השירים של הערב צריכים אולפן",
  subtitle: "בלי לייבל. רק אתם.",

  bitPhone: "0526354874",
  bitName:  "טל יעקב סודאי",
  bitLink:  "",          // הקישור מתוך קוד הביט. ריק = מציג מספר להעתקה

  creditLink: "",        // קישור סאמיט לאשראי. ריק = לא מוצג
  listenLink: "https://submithub.com/link/tal-suday",

  // gift ריק ("") = לא מציג שורת תשורה. הסדר כאן = הסדר בדף.
  tiers: [
    { price: 150, photo: "photo-150.jpg", emoji: "😵", face: "מתעלף",  gift: "קרדיט ביוטיוב + סרטון ממני", best: false },
    { price: 70,  photo: "photo-70.jpg",  emoji: "🙏", face: "מודה לך", gift: "סקיצה גנוזה, רק לך",        best: true  },
    { price: 30,  photo: "photo-30.jpg",  emoji: "😊", face: "מחייך",  gift: "שאאוטאאוט בסטורי",           best: false }
  ]
};
</script>

<style>
  :root{ --paper:#f6f0e4; --ink:#111; --purple:#7B2FF7; --tape:rgba(235,225,185,.85); }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{background:var(--paper)}
  body{background:var(--paper);color:var(--ink);font-family:Rubik,system-ui,sans-serif;min-height:100vh;
       background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:460px;margin:0 auto;padding:26px 16px 40px}
  .k{font-family:Karantina,sans-serif;font-weight:700;line-height:.95}
  h1{font-size:56px;text-align:center}
  .sub{font-size:30px;text-align:center;color:var(--purple);margin-top:4px}
  .scrib{display:block;width:70%;height:14px;margin:2px auto 0}

  .tier{position:relative;display:flex;align-items:center;gap:14px;margin-top:34px;
        background:#fff;border:4px solid var(--ink);border-radius:14px 5px 16px 4px;
        box-shadow:5px 6px 0 var(--ink);padding:12px;cursor:pointer;
        -webkit-tap-highlight-color:transparent}
  .tier:nth-child(odd){transform:rotate(-1deg)} .tier:nth-child(even){transform:rotate(.8deg)}
  .tier:active{box-shadow:2px 3px 0 var(--ink);translate:3px 3px}
  .tier.best{border-color:var(--purple);box-shadow:5px 6px 0 var(--purple)}
  .pic{position:relative;flex:none;width:112px;height:132px;background:#fff;padding:6px 6px 22px;
       box-shadow:0 3px 8px rgba(0,0,0,.18);transform:rotate(-3deg)}
  .pic img{width:100%;height:100%;object-fit:cover;display:block;background:#ddd}
  .emo{display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:58px;background:#f1ebff}
  .pic span{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:20px}
  .tape{position:absolute;top:-10px;right:18px;width:62px;height:20px;background:var(--tape);transform:rotate(-8deg)}
  .info{flex:1;min-width:0}
  .price{font-size:64px}
  .price small{font-size:34px}
  .best .price{color:var(--purple)}
  .gift{font-size:16px;font-weight:500;line-height:1.3;margin-top:2px}
  .go{display:inline-block;margin-top:8px;background:var(--purple);color:#fff;font-weight:800;font-size:17px;
      padding:9px 18px;border:3px solid var(--ink);border-radius:30px}
  .badge{position:absolute;top:-18px;left:16px;background:var(--ink);color:#fff;font-weight:800;font-size:14px;
         padding:4px 12px;transform:rotate(3deg);border-radius:3px}

  .foot{margin-top:40px;text-align:center;font-size:15px;line-height:2}
  .foot a{color:var(--ink);font-weight:800}

  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:9}
  .sheet.on{display:flex}
  .panel{width:100%;max-width:460px;margin:0 auto;background:var(--paper);border-top:5px solid var(--ink);
         border-radius:18px 18px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));text-align:center}
  .big{font-size:84px;color:var(--purple)}
  .hint{font-size:18px;font-weight:500;margin-top:6px}
  .copy{margin:16px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:320px;
        background:#fff;border:3px solid var(--ink);padding:8px 10px;font-weight:800;font-size:22px;direction:ltr}
  .copy button{font:800 15px Rubik;background:var(--ink);color:#fff;border:0;padding:8px 14px;border-radius:20px;cursor:pointer}
  .open{display:block;margin:18px auto 0;max-width:320px;background:var(--purple);color:#fff;text-decoration:none;
        font-weight:800;font-size:20px;padding:14px;border:3px solid var(--ink);border-radius:40px}
  .small{font-size:13px;color:#555;margin-top:10px}
  .x{margin-top:14px;background:none;border:0;font:500 16px Rubik;color:#555;cursor:pointer;padding:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="k" id="title"></h1>
  <svg class="scrib" viewBox="0 0 600 30" preserveAspectRatio="none"><path d="M5 18 C 80 6, 160 26, 250 14 S 420 4, 595 16" fill="none" stroke="#7B2FF7" stroke-width="8" stroke-linecap="round"/></svg>
  <p class="sub k" id="subtitle"></p>

  <div id="tiers"></div>

  <p class="foot">
    <a id="credit" target="_blank" rel="noopener" hidden>אין ביט? באשראי</a><br>
    <a id="listen">להאזין ולעקוב ←</a>
  </p>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="big k" id="sAmount"></div>
    <p class="hint">את הסכום הזה מקלידים בביט,<br>ובהערה את האינסטגרם שלך 🙏</p>
    <div class="copy" id="sCopy"><span id="sPhone"></span><button id="sBtn">העתקה</button></div>
    <a class="open" id="sOpen">לביט ←</a>
    <p class="small" id="sName"></p>
    <button class="x" id="sClose">סגירה</button>
  </div>
</div>

<script>
(function(){
  const S = SETTINGS, $ = id => document.getElementById(id);
  $("title").textContent = S.title;
  $("subtitle").textContent = S.subtitle;
  $("listen").href = S.listenLink;
  if (S.creditLink){ $("credit").href = S.creditLink; $("credit").hidden = false; }

  S.tiers.forEach(t => {
    const el = document.createElement("div");
    el.className = "tier" + (t.best ? " best" : "");
    el.innerHTML =
      (t.best ? '<span class="badge">הכי נבחר</span>' : '') +
      '<div class="pic"><i class="tape"></i><img alt="" loading="lazy"><span class="k"></span></div>' +
      '<div class="info"><div class="price k">' + t.price + '<small> ₪</small></div>' +
      '<p class="gift"></p><span class="go">בביט</span></div>';
    const img = el.querySelector("img");
    img.onerror = () => { const e = document.createElement("b"); e.className = "emo"; e.textContent = t.emoji; img.replaceWith(e); };
    img.src = t.photo;
    el.querySelector(".pic span").textContent = t.face;
    const g = el.querySelector(".gift");
    if (t.gift) g.textContent = t.gift; else g.hidden = true;
    el.onclick = () => openBit(t);
    $("tiers").appendChild(el);
  });

  function openBit(t){
    $("sAmount").textContent = t.price + " ₪";
    $("sPhone").textContent = S.bitPhone;
    $("sName").textContent = "בביט יופיע: " + S.bitName;
    $("sCopy").hidden = !!S.bitLink;
    $("sOpen").hidden = !S.bitLink;
    if (S.bitLink) $("sOpen").href = S.bitLink;
    $("sheet").classList.add("on");
  }
  const close = () => $("sheet").classList.remove("on");
  $("sClose").onclick = close;
  $("sheet").onclick = e => { if (e.target.id === "sheet") close(); };
  $("sBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(S.bitPhone); } catch(e){
      const ta = document.createElement("textarea"); ta.value = S.bitPhone; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand("copy"); }catch(_){} ta.remove(); }
    $("sBtn").textContent = "הועתק ✓"; setTimeout(() => $("sBtn").textContent = "העתקה", 1500);
  };
})();
</script>
</body>
</html>
